version: 2
# Weekly, Mondays. cooldown: a version younger than two weeks is not
# proposed (a package two days old broke docling once).
updates:
  # storage: Go modules
  - package-ecosystem: "gomod"
    directory: "/storage"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: ["dependencies", "storage"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # images: Go modules
  - package-ecosystem: "gomod"
    directory: "/images"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: ["dependencies", "images"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # chat: Go modules
  - package-ecosystem: "gomod"
    directory: "/chat"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: ["dependencies", "chat"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # chat: the widget's npm packages (TypeScript, at build time only)
  - package-ecosystem: "npm"
    directory: "/chat/widget"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    labels: ["dependencies", "chat"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # docling: Python packages (requirements.txt; torch is in the Dockerfile)
  - package-ecosystem: "pip"
    directory: "/docling"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    labels: ["dependencies", "docling"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # ocr: Python packages (requirements.txt)
  - package-ecosystem: "pip"
    directory: "/ocr"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    labels: ["dependencies", "ocr"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # pi: npm packages (pi itself among them)
  - package-ecosystem: "npm"
    directory: "/pi"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: ["dependencies", "pi"]
    commit-message:
      prefix: "chore"
      include: "scope"
    # Node's types follow the image's Node, 24: a later major describes
    # APIs the runtime does not have.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # claude: npm packages (Claude Code is not among them: the plugin installs
  # it at runtime, and its update node keeps it)
  - package-ecosystem: "npm"
    directory: "/claude"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: ["dependencies", "claude"]
    commit-message:
      prefix: "chore"
      include: "scope"
    # Node's types follow the image's Node, 24: a later major describes
    # APIs the runtime does not have.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # exec: npm packages
  - package-ecosystem: "npm"
    directory: "/exec"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: ["dependencies", "exec"]
    commit-message:
      prefix: "chore"
      include: "scope"
    # Node's types follow the image's Node, 24: a later major describes
    # APIs the runtime does not have.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # preview: npm packages. playwright-core follows the Playwright server it
  # drives (a minor version apart, they refuse each other): only its patch
  # releases are proposed; a minor one moves the server too, by hand.
  - package-ecosystem: "npm"
    directory: "/preview"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: ["dependencies", "preview"]
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Node's types follow the image's Node, 24.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "playwright-core"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # agent-kit: npm packages (TypeScript and Node's types, for its tests)
  - package-ecosystem: "npm"
    directory: "/agent-kit"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    labels: ["dependencies", "agent-kit"]
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # database: Go modules
  - package-ecosystem: "gomod"
    directory: "/database"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: ["dependencies", "database"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # The base images of the Dockerfiles
  - package-ecosystem: "docker"
    directories: ["/storage", "/docling", "/pi", "/claude", "/exec", "/database", "/images", "/ocr", "/preview"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # The GitHub Actions of the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore"
      include: "scope"
