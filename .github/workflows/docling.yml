name: docling
# A PR, or a push that touches docling/, checks the server. A tag
# docling/vX.Y.Z builds its image (amd64, about 5 GB), tries it, pushes it
# to GHCR as :X.Y.Z and :latest, and makes the release with its section of
# docling/CHANGELOG.md.

on:
  # Every PR runs the tests of both plugins, required by the protection of
  # main: a check filtered by path would never report on a PR of the other.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ["docling/**", ".github/workflows/docling.yml"]
    tags: ["docling/v*.*.*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: daniele-chiappa/gosidian-docling

jobs:
  check:
    name: Check the server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compile
        run: docker run --rm -v "$PWD/docling:/src:ro" python:3.12-slim python -X pycache_prefix=/tmp -m py_compile /src/server.py

  image:
    name: Build & push image
    needs: [check]
    if: startsWith(github.ref, 'refs/tags/docling/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Version and notes
        id: meta
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#docling/v}"
          awk -v ver="$VERSION" '$0 ~ "^## \\[" ver "\\]" {f=1; next} f && /^## \[/ {exit} f {print}' \
            docling/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "docling/CHANGELOG.md has no section [$VERSION]"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "base=${REGISTRY}/${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        # torch, the models and LibreOffice: the build needs about 15 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      - name: Build
        run: |
          set -eu
          docker build --build-arg VERSION="${{ steps.meta.outputs.version }}" --build-arg REVISION="${GITHUB_SHA}" \
            -t "${{ steps.meta.outputs.base }}:${{ steps.meta.outputs.version }}" docling/
          docker tag "${{ steps.meta.outputs.base }}:${{ steps.meta.outputs.version }}" "${{ steps.meta.outputs.base }}:latest"

      - name: Try it
        run: |
          set -eu
          docker run -d --name docling-smoke --read-only --tmpfs /tmp:size=1g -e GOSIDIAN_PLUGIN_TOKEN=smoke \
            "${{ steps.meta.outputs.base }}:${{ steps.meta.outputs.version }}"
          for _ in $(seq 1 60); do
            if docker exec docling-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)" 2>/dev/null; then break; fi
            sleep 5
          done
          docker exec docling-smoke python -c "
          import json, urllib.request
          req = urllib.request.Request('http://127.0.0.1:8000/mcp', method='POST',
              data=json.dumps({'jsonrpc': '2.0', 'id': 1, 'method': 'tools/call', 'params': {'name': 'gosidian_manifest', 'arguments': {}}}).encode(),
              headers={'Authorization': 'Bearer smoke', 'Content-Type': 'application/json', 'Accept': 'application/json, text/event-stream', 'MCP-Protocol-Version': '2025-06-18'})
          m = json.load(urllib.request.urlopen(req, timeout=10))['result']['structuredContent']
          assert m['name'] == 'docling' and m['gosidian'] == 1 and m['version'] == '${{ steps.meta.outputs.version }}', m
          print('manifest', m['version'])
          "
          docker exec docling-smoke test -s /licenses/THIRD_PARTY_NOTICES.md

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          docker push "${{ steps.meta.outputs.base }}:${{ steps.meta.outputs.version }}"
          docker push "${{ steps.meta.outputs.base }}:latest"

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "docling ${{ steps.meta.outputs.version }}" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo "- \`${{ steps.meta.outputs.base }}:${{ steps.meta.outputs.version }}\` (amd64)"
            echo "- \`${{ steps.meta.outputs.base }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up
        if: always()
        run: docker rm -f docling-smoke || true
