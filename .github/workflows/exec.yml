name: exec
# A PR, or a push that touches exec/, tests the plugin. A tag exec/vX.Y.Z
# builds its image (amd64), checks it as it runs in production
# (separation-test, with a throwaway sshd as a host), pushes it to GHCR as
# :X.Y.Z and :latest, and makes the release with its section of
# exec/CHANGELOG.md.

on:
  # Every PR runs the tests of every plugin, required by the protection of
  # main: a check filtered by path would never report on a PR of another.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ["exec/**", "agent-kit/**", ".github/workflows/exec.yml"]
    tags: ["exec/v*.*.*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: daniele-chiappa/gosidian-exec

jobs:
  test:
    name: Test the exec plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exec
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Types
        run: npm run check

      - name: Tests
        # Real scripts as the runner's user, bare repositories on disk, a
        # fake ssh, and sshd when the runner has it.
        run: npm test

  image:
    name: Build & push image
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/exec/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Version and notes
        id: meta
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#exec/v}"
          awk -v ver="$VERSION" '$0 ~ "^## \\[" ver "\\]" {f=1; next} f && /^## \[/ {exit} f {print}' \
            exec/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "exec/CHANGELOG.md has no section [$VERSION]"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "base=${REGISTRY}/${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -eu
          docker build --build-arg VERSION="${{ steps.meta.outputs.version }}" --build-arg REVISION="${GITHUB_SHA}" \
            --build-context kit=agent-kit -t "${{ steps.meta.outputs.base }}:${{ steps.meta.outputs.version }}" exec/
          docker tag "${{ steps.meta.outputs.base }}:${{ steps.meta.outputs.version }}" "${{ steps.meta.outputs.base }}:latest"

      - name: Try it as in production
        run: IMAGE="${{ steps.meta.outputs.base }}:${{ steps.meta.outputs.version }}" exec/scripts/separation-test.sh

      - name: Login to GHCR
        # The docker CLI, not a third-party action.
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

      - name: Push
        run: |
          docker push "${{ steps.meta.outputs.base }}:${{ steps.meta.outputs.version }}"
          docker push "${{ steps.meta.outputs.base }}:latest"

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "exec ${{ steps.meta.outputs.version }}" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo "- \`${{ steps.meta.outputs.base }}:${{ steps.meta.outputs.version }}\` (amd64)"
            echo "- \`${{ steps.meta.outputs.base }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
